<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Vivid brand gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#6366f1"/>
      <stop offset="50%"  stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Glassy top-left highlight -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.45)"/>
      <stop offset="60%"  stop-color="rgba(255,255,255,0)"/>
    </linearGradient>

    <!-- Outer glow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.4"/>
      <feOffset dy="2" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Squircle base with gradient -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- Top-left glassy highlight -->
  <path d="M2 18 Q2 2 18 2 L52 2 Q44 14 26 22 Q12 28 2 28 Z"
        fill="url(#shine)"/>

  <!-- Bold "SP" monogram in JetBrains Mono style -->
  <g fill="#ffffff" filter="url(#softShadow)">
    <!-- S -->
    <path d="M 14 22
             Q 14 17 21 17
             L 28 17
             Q 32 17 32 21
             L 32 22
             L 26 22
             Q 26 21 25 21
             L 22 21
             Q 20 21 20 22
             L 20 22.5
             Q 20 24 22 24
             L 27 24
             Q 33 24 33 30
             Q 33 35 27 35
             L 19 35
             Q 13 35 13 30
             L 13 29
             L 19 29
             Q 19 31 20 31
             L 26 31
             Q 27 31 27 29.5
             Q 27 28 25 28
             L 20 28
             Q 14 28 14 22 Z"/>

    <!-- P -->
    <path d="M 36 17
             L 47 17
             Q 53 17 53 23
             Q 53 29 47 29
             L 42 29
             L 42 35
             L 36 35
             Z
             M 42 21
             L 42 25
             L 47 25
             Q 49 25 49 23
             Q 49 21 47 21
             Z"/>
  </g>

  <!-- Tiny accent dot for that "online" pop -->
  <circle cx="51" cy="13" r="3" fill="#fde047" opacity="0.95"/>

  <!-- Code accent at bottom -->
  <g stroke="#ffffff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M 18 44 L 14 48 L 18 52"/>
    <path d="M 46 44 L 50 48 L 46 52"/>
    <line x1="28" y1="42" x2="36" y2="54" stroke-width="2.2"/>
  </g>
</svg>
