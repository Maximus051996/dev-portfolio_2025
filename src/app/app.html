<!-- SCROLL PROGRESS BAR -->
<div class="scroll-progress" [style.width.%]="scrollProgress"></div>

<!-- NAVBAR -->
<nav class="site-nav">
  <div class="max-w-6xl mx-auto px-4">

    <div class="flex justify-between items-center py-4">

      <div class="flex items-center gap-2.5">

        <!-- Premium Brand Logo: SP Monogram in code brackets -->
        <a (click)="scrollTo('bio', $event)" class="brand-mark" aria-label="Sayan Pramanick">
          <svg viewBox="0 0 64 64" class="brand-svg" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="brandFill" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#6366f1"/>
                <stop offset="50%"  stop-color="#8b5cf6"/>
                <stop offset="100%" stop-color="#ec4899"/>
              </linearGradient>
              <filter id="brandGlow" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>

            <!-- Rounded squircle background with gradient -->
            <rect x="2" y="2" width="60" height="60" rx="16"
                  fill="url(#brandFill)"
                  filter="url(#brandGlow)"/>

            <!-- Glassy highlight -->
            <path d="M2 18 Q2 2 18 2 L46 2 Q42 16 30 22 Q14 28 2 28 Z"
                  fill="rgba(255,255,255,0.18)"/>

            <!-- Code brackets with stylized S -->
            <g fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
              <path d="M 22 22 L 14 32 L 22 42"/>
              <path d="M 42 22 L 50 32 L 42 42"/>
            </g>

            <path d="M 36 24
                     Q 28 24 28 28
                     Q 28 32 32 32
                     Q 36 32 36 36
                     Q 36 40 28 40"
                  fill="none" stroke="#fff" stroke-width="3"
                  stroke-linecap="round" stroke-linejoin="round"/>

            <circle cx="50" cy="14" r="3" fill="#fde047">
              <animate attributeName="opacity"
                       values="0.5;1;0.5"
                       dur="1.6s" repeatCount="indefinite"/>
            </circle>
          </svg>
        </a>

        <a (click)="scrollTo('bio', $event)"
           class="brand-title cursor-pointer select-none">
          Dev <span>Portfolio</span>
        </a>
      </div>

      <!-- MOBILE MENU BUTTON -->
      <button class="menu-btn md:!hidden"
              (click)="menuOpen = !menuOpen"
              [class.is-open]="menuOpen"
              aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>

      <!-- DESKTOP MENU -->
      <ul class="hidden md:flex gap-7 text-sm font-semibold items-center">
        <li *ngFor="let item of navItems">
          <a (click)="scrollTo(item.id, $event)"
             class="nav-link"
             [class.active]="activeSection === item.id">
            {{ item.label }}
          </a>
        </li>
      </ul>

    </div>

    <!-- MOBILE MENU -->
    <ul *ngIf="menuOpen"
        class="mobile-menu md:hidden flex flex-col">
      <li *ngFor="let item of navItems; let i = index">
        <a (click)="scrollTo(item.id, $event); menuOpen=false"
           class="mobile-item"
           [class.active]="activeSection === item.id"
           [style.animation-delay.ms]="i * 60">
          {{ item.label }}
        </a>
      </li>
    </ul>

  </div>
</nav>


<!-- SECTIONS -->
<main class="w-full">

  <section id="bio" class="section-shell bg-bio">
    <div class="max-w-6xl mx-auto">
      <app-bio></app-bio>
    </div>
  </section>

  <section id="tech" class="section-shell bg-tech">
    <div class="max-w-6xl mx-auto">
      <app-tech></app-tech>
    </div>
  </section>

  <section id="experience" class="section-shell bg-experience">
    <div class="max-w-6xl mx-auto">
      <app-experience></app-experience>
    </div>
  </section>

  <section id="certifications" class="section-shell bg-certifications">
    <div class="max-w-6xl mx-auto">
      <app-certifications></app-certifications>
    </div>
  </section>

  <section id="studies" class="section-shell bg-studies">
    <div class="max-w-6xl mx-auto">
      <app-studies></app-studies>
    </div>
  </section>

  <section id="contact" class="section-shell bg-contact">
    <div class="max-w-6xl mx-auto">
      <app-contact></app-contact>
    </div>
  </section>

</main>

<!-- BACK TO TOP -->
<button *ngIf="scrollProgress > 8"
        (click)="scrollTo('bio', $event)"
        class="back-to-top"
        aria-label="Back to top">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5"/><path d="M5 12l7-7 7 7"/>
  </svg>
</button>

<!-- AI CHATBOT -->
