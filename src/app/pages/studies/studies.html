<div class="edu-wrap">
  <div class="edu-head">
    <div class="eyebrow section-eyebrow" appReveal="zoom">Academic Path</div>
    <h2 class="edu-title" appReveal="rise" delay="80">
      Education <span class="grad gradient-sweep">Timeline</span>
    </h2>
    <p class="edu-sub" appReveal delay="160">A foundation built on curiosity, computer science, and continuous learning.</p>
  </div>

  <div class="timeline-grid">
    <div *ngFor="let e of (education | async); let i = index"
         #eduItem
         class="edu-item"
         appReveal="rise"
         [delay]="i * 140">

      <!-- Year medallion -->
      <div class="circle">
        <div class="circle-inner">
          <div class="year">{{ e.year }}</div>
          <div class="year-label">Class of</div>
        </div>
        <div class="orbit-dot"></div>
      </div>

      <!-- Connector arrow -->
      <div class="connector">
        <span class="connector-line"></span>
        <span class="connector-arrow"></span>
      </div>

      <!-- Card -->
      <div class="edu-card card-hover">
        <div class="degree-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6"/>
            <path d="M2 10 12 5l10 5-10 5L2 10z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </div>
        <h3 class="edu-degree">{{ e.degree }}</h3>
        <p class="edu-stream">{{ e.stream }}</p>
        <p class="edu-inst">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18"/>
            <path d="M5 21V8l7-5 7 5v13"/>
            <path d="M9 21v-6h6v6"/>
          </svg>
          {{ e.institute }}
        </p>
      </div>
    </div>
  </div>
</div>
