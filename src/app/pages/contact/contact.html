<div class="contact-ui">
  <div class="contact-grid">

    <!-- LEFT SIDE -->
    <div class="hero-left" appReveal="left">

      <!-- Illustration: 3D envelope with paper plane -->
      <div class="mailbox-wrapper">
        <div class="ribbon ribbon-1"></div>
        <div class="ribbon ribbon-2"></div>
        <div class="ribbon ribbon-3"></div>

        <div class="mail-orbit-dot dot-1"></div>
        <div class="mail-orbit-dot dot-2"></div>
        <div class="mail-orbit-dot dot-3"></div>

        <div class="mail-stage">
          <!-- Glassy disc -->
          <div class="mail-disc"></div>

          <!-- 3D Envelope SVG -->
          <svg class="envelope-svg" viewBox="0 0 220 180" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="envBody" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#6366f1"/>
                <stop offset="50%"  stop-color="#8b5cf6"/>
                <stop offset="100%" stop-color="#ec4899"/>
              </linearGradient>
              <linearGradient id="envFlap" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#a855f7"/>
                <stop offset="100%" stop-color="#f472b6"/>
              </linearGradient>
              <linearGradient id="envShadow" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%"   stop-color="rgba(15,23,42,0.20)"/>
                <stop offset="100%" stop-color="rgba(15,23,42,0)"/>
              </linearGradient>
              <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#ffffff"/>
                <stop offset="100%" stop-color="#e2e8f0"/>
              </linearGradient>
              <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%"   stop-color="#06b6d4"/>
                <stop offset="100%" stop-color="#3b82f6"/>
              </linearGradient>
            </defs>

            <!-- Drop shadow -->
            <ellipse cx="110" cy="160" rx="72" ry="6" fill="url(#envShadow)"/>

            <!-- Envelope body -->
            <g class="envelope">
              <rect x="30" y="60" width="160" height="100" rx="12" fill="url(#envBody)"/>

              <!-- Letter (paper) sticking out -->
              <g class="paper">
                <rect x="50" y="38" width="120" height="74" rx="6" fill="url(#paperGrad)" stroke="#cbd5e1" stroke-width="1"/>
                <line x1="62" y1="56" x2="158" y2="56" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
                <line x1="62" y1="68" x2="148" y2="68" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
                <line x1="62" y1="80" x2="138" y2="80" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
                <line x1="62" y1="92" x2="120" y2="92" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
              </g>

              <!-- Front flap (V) -->
              <path d="M30 72 L110 130 L190 72 L190 160 L30 160 Z" fill="url(#envFlap)" opacity=".95"/>
              <!-- subtle highlight -->
              <path d="M30 72 L110 130 L190 72" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
            </g>

            <!-- Paper plane orbiting -->
            <g class="paper-plane">
              <path d="M0 0 L34 -10 L20 0 L34 10 Z M20 0 L10 4" fill="url(#planeGrad)" stroke="#0ea5e9" stroke-width="1" stroke-linejoin="round"/>
            </g>
          </svg>
        </div>
      </div>

      <div class="eyebrow section-eyebrow">Let's Build Something</div>
      <h2 class="hero-title">Let's <span class="grad gradient-sweep">&lt;Talk/&gt;</span></h2>
      <p class="hero-subtext">
        I'm always open to new opportunities, collaborations, and meaningful conversations.
      </p>

      <!-- Quick info pills -->
      <div class="info-pills">
        <a href="mailto:sayanpra07@gmail.com" class="info-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/>
            <path d="m3 7 9 6 9-6"/>
          </svg>
          sayanpra07&#64;gmail.com
        </a>
        <span class="info-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          Ranaghat, West Bengal
        </span>
        <span class="info-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
          Replies within 24h
        </span>
      </div>
    </div>

    <!-- FORM -->
    <form #formRef="ngForm" (ngSubmit)="sendMessage(formRef)" class="form-card" appReveal="right" delay="120">

      <div class="form-card-head">
        <h3 class="form-title">
          Get In <span class="grad-highlight">Touch</span>
        </h3>
        <p class="email-line">
          Drop a message and I'll get back within 24 hours.
        </p>
      </div>

      <div class="field">
        <label for="cName">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
          </svg>
          Your Name
        </label>
        <input id="cName"
               class="input-box"
               type="text"
               name="name"
               [(ngModel)]="form.name"
               placeholder="John Doe"
               required />
      </div>

      <div class="field">
        <label for="cEmail">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
          </svg>
          Email Address
        </label>
        <input id="cEmail"
               class="input-box"
               type="email"
               name="email"
               [(ngModel)]="form.email"
               placeholder="hello@example.com"
               required
               email />
      </div>

      <div class="field">
        <label for="cMessage">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          Message
        </label>
        <textarea id="cMessage"
                  class="input-box textarea"
                  name="message"
                  [(ngModel)]="form.message"
                  placeholder="Tell me about your project, opportunity, or idea..."
                  required
                  minlength="5"></textarea>
      </div>

      <button type="submit"
              class="send-btn"
              appMagnetic
              [strength]="14"
              [disabled]="loading || !formRef.valid">
        <span *ngIf="!loading">Send Message</span>
        <span *ngIf="loading" class="dot-loader"><i></i><i></i><i></i></span>
        <svg *ngIf="!loading" class="send-icon" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="m22 2-7 20-4-9-9-4 20-7z"/>
          <path d="M22 2 11 13"/>
        </svg>
      </button>

      <p *ngIf="success" class="success-msg">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        Message sent successfully — talk soon!
      </p>
    </form>

  </div>
</div>
