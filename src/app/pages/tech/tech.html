<div class="tech-wrap" *ngIf="tech$ | async as tech">

  <!-- Section heading -->
  <div class="tech-head">
    <div class="eyebrow section-eyebrow" appReveal="zoom">My Toolbox</div>
    <h2 class="tech-title-gradient gradient-sweep" appReveal="rise" delay="80">Enterprise Tech Stack</h2>
    <p class="tech-subtitle" appReveal delay="160">
      A curated set of technologies I use to ship fast, secure, and scalable products.
    </p>
  </div>

  <!-- Cards grid -->
  <div class="tech-grid">
    <div class="tech-card card-hover"
         *ngFor="let c of categories; let i = index"
         #techCard
         appReveal="rise"
         [delay]="i * 90"
         [style.--accent]="c.cssAccent">

      <!-- Glow halo -->
      <div class="card-halo"></div>

      <!-- Icon + title row -->
      <div class="card-head">
        <div class="card-icon" [innerHTML]="c.icon"></div>
        <div>
          <h3 class="card-title">{{ c.label }}</h3>
          <p class="card-count">{{ tech[c.key].length }} technologies</p>
        </div>
      </div>

      <!-- Stack chips -->
      <div class="chip-row">
        <span *ngFor="let item of tech[c.key]; let j = index"
              class="tech-chip"
              [style.--chip-accent]="c.cssAccent"
              [style.animation-delay.ms]="(i * 90) + (j * 50)">
          {{ item }}
        </span>
      </div>

      <!-- Bottom progress bar -->
      <div class="card-bar"></div>
    </div>
  </div>
</div>
