<div class="cert-wrap">

  <div class="cert-head">
    <div class="eyebrow section-eyebrow" appReveal="zoom">Cloud &amp; AI</div>
    <h2 class="cert-title" appReveal="rise" delay="80">
      Certifications <span class="grad gradient-sweep">Achieved</span>
    </h2>
    <p class="cert-sub" appReveal delay="160">
      Industry-recognized certifications validating cloud and AI expertise.
    </p>
  </div>

  <div *ngIf="certifications$ | async as certs" class="cert-grid">

    <ng-container *ngFor="let c of certs; let i = index">
      <ng-container *ngIf="styleFor(c) as s">

        <a class="cert-card card-hover"
           [href]="c.verifyUrl || null"
           target="_blank"
           rel="noopener noreferrer"
           [attr.aria-label]="c.verifyUrl ? 'View ' + c.name + ' credential (opens in new tab)' : c.name"
           appReveal="zoom"
           [delay]="i * 110"
           [style.--accent]="s.color"
           [style.--ribbon]="s.ribbon">

          <!-- Issuer ribbon -->
          <span class="ribbon" [style.background]="s.ribbon">{{ c.issuer }}</span>

          <!-- Brand badge -->
          <div class="badge-wrap">
            <div class="badge-glow"></div>
            <div class="badge-circle">

              <!-- Azure logo -->
              <svg *ngIf="s.iconKey === 'azure'"
                   class="brand-svg" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-label="Microsoft Azure">
                <defs>
                  <linearGradient id="azG1" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%"  stop-color="#114a8b"/>
                    <stop offset="100%" stop-color="#0669bc"/>
                  </linearGradient>
                  <linearGradient id="azG2" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%"  stop-color="#3ccbf4"/>
                    <stop offset="100%" stop-color="#2892df"/>
                  </linearGradient>
                </defs>
                <path fill="url(#azG1)" d="M37 11h22L34 84a3 3 0 0 1-3 2H14a3 3 0 0 1-3-4L34 13a3 3 0 0 1 3-2z"/>
                <path fill="#0078d4" d="M68 60H35a1.5 1.5 0 0 0-1 2.6L55 81a3 3 0 0 0 2 1h22z"/>
                <path fill="url(#azG2)" d="M68 11H46l-3 9a3 3 0 0 0 .7 3.4L74 50l-12 32a3 3 0 0 0 2.8 4h17a3 3 0 0 0 2.9-2L84 13a3 3 0 0 0-3-2z"/>
              </svg>

              <!-- Google Cloud logo -->
              <svg *ngIf="s.iconKey === 'gcp'"
                   class="brand-svg" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-label="Google Cloud">
                <path fill="#ea4335" d="M58 28l4-4 .3-1.7C55-3 33-2 22 9c-3 3-5.5 6.6-7 10.6 1-.7 3-.2 3-.2l9-1.5s.4-.8.6-.7C32 11 41 10 47 16l1 .2 8-7.7-.2 1.5L58 28z"/>
                <path fill="#4285f4" d="M73 20c-1-4-3-8-6-11l-9 9c3 3 5 6 5 11v1c4 0 7 3 7 7s-3 7-7 7H50l-1 1v13l1 1h17c10 0 18-8 18-18 0-7-4-13-12-15z"/>
                <path fill="#34a853" d="M32 79h17V64H32c-1 0-2-.3-3-.6l-2 .6-9 9-.7 2c4 3 9 4 14 4z"/>
                <path fill="#fbbc04" d="M32 41C22 41 13 49 13 60c0 6 3 12 8 15l9-9c-2-1-3-3-3-6 0-4 3-7 7-7l5 1 9-9c-4-3-9-5-15-5z"/>
              </svg>

              <!-- AWS logo -->
              <svg *ngIf="s.iconKey === 'aws'"
                   class="brand-svg" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-label="Amazon Web Services">
                <path fill="#252f3e" d="M30 51c0 1 .1 2 .4 2.6.3.6.6 1.3 1.1 2 .2.2.2.5.2.6 0 .3-.2.5-.5.8l-1.6 1c-.2.1-.5.2-.7.2-.3 0-.5-.1-.8-.4a8 8 0 0 1-1-1.3l-.8-1.5c-2 2.4-4.5 3.6-7.5 3.6-2.2 0-3.9-.6-5.1-1.9-1.3-1.2-2-2.9-2-5 0-2.2.8-4 2.4-5.4 1.6-1.4 3.7-2 6.4-2 1 0 1.8 0 2.7.2.9.1 1.8.3 2.7.5v-1.7c0-2-.4-3.4-1.3-4.2-.9-.8-2.3-1.2-4.4-1.2a12.6 12.6 0 0 0-5.5 1.3 4.4 4.4 0 0 1-.7.3l-.5.1c-.4 0-.6-.3-.6-.9V37a2 2 0 0 1 .2-1c.1-.2.4-.4.8-.6 1.2-.6 2.5-1.1 4-1.5 1.6-.4 3.2-.6 5-.6 3.7 0 6.5.9 8.3 2.6 1.7 1.7 2.6 4.3 2.6 7.7v10.2H30zm-10.4 4c.8 0 1.7-.2 2.6-.5.9-.3 1.7-.9 2.4-1.7.4-.5.7-1 1-1.6.1-.6.2-1.4.2-2.3v-1c-.7-.2-1.4-.4-2.2-.5-.7-.1-1.5-.2-2.2-.2-1.6 0-2.7.3-3.5 1-.7.6-1.1 1.5-1.1 2.7 0 1.1.3 2 .9 2.5.6.7 1.5 1 2.7 1zm20.6 2.8c-.5 0-.8-.1-1-.3-.2-.2-.4-.6-.6-1.2L33 36.6c-.2-.6-.3-1-.3-1.2 0-.5.3-.8.8-.8h2.5c.5 0 .9.1 1 .3.3.2.4.6.6 1.2l4 16 3.7-16c.1-.6.3-1 .6-1.2.2-.2.6-.3 1-.3h2c.5 0 .9.1 1 .3.3.2.5.6.6 1.2l3.8 16.2 4.2-16.2c.2-.6.3-1 .6-1.2.2-.2.6-.3 1-.3h2.4c.5 0 .8.3.8.8a3 3 0 0 1-.3 1.2L57 56.3a2 2 0 0 1-.6 1.2c-.2.2-.6.3-1 .3h-2.2c-.5 0-.9-.1-1-.3-.3-.3-.5-.7-.6-1.2L48 41l-3.6 15.3c-.1.5-.3 1-.6 1.2-.2.2-.6.3-1 .3h-2.2zM75 58.3c-1.7 0-3.4-.2-5-.6a14 14 0 0 1-3.8-1.4c-.7-.4-1.2-.8-1.4-1.2a3 3 0 0 1-.2-1V53c0-.6.2-.9.6-.9.2 0 .4 0 .6.1l.7.4c1 .4 2 .8 3 1 1 .3 2.2.5 3.3.5 1.7 0 3-.3 4-1 1-.6 1.5-1.5 1.5-2.6 0-.8-.3-1.4-.8-1.9-.6-.5-1.6-1-3-1.4l-4.4-1.4c-2.2-.7-3.8-1.7-4.9-3a7 7 0 0 1-1.4-4.4c0-1.2.2-2.4.8-3.4.5-1 1.2-1.8 2.1-2.5.9-.7 2-1.3 3.2-1.7 1.2-.4 2.5-.6 3.9-.6.7 0 1.4 0 2 .1l2 .4 1.7.5c.5.2 1 .4 1.3.6.4.2.6.5.8.7.2.2.3.5.3.9V36c0 .6-.2.9-.7.9a3.6 3.6 0 0 1-1.1-.4 13 13 0 0 0-5.7-1c-1.5 0-2.8.2-3.6.7-.9.4-1.4 1.2-1.4 2.3 0 .7.3 1.4.9 1.9s1.7 1 3.3 1.5l4.3 1.4c2.2.7 3.7 1.7 4.7 2.9 1 1.2 1.4 2.6 1.4 4.2 0 1.3-.3 2.5-.8 3.5a8 8 0 0 1-2.3 2.7c-1 .8-2 1.4-3.4 1.7-1.4.5-3 .7-4.6.7z"/>
                <path fill="#f90" d="M83 70a48 48 0 0 1-67-3.5c-1-.9-.1-2.1.9-1.4a65 65 0 0 0 64.5 4c1.4-.6 2.6 1 1.3 1.9zM87 65.6c-1-1.2-6-.6-8.3-.3-.7.1-.8-.5-.2-1 4-2.7 10.4-2 11-1 .8.9-.2 7.3-3.9 10.4-.5.4-1 .2-.8-.4.8-2 2.3-6.5 1.3-7.7z"/>
              </svg>

              <!-- Generic shield -->
              <svg *ngIf="s.iconKey === 'generic'"
                   class="brand-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-label="Certification">
                <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" />
                <path d="M12 2 4 6v6c0 5 3.4 9 8 10 4.6-1 8-5 8-10V6l-8-4z" />
              </svg>
            </div>
          </div>

          <!-- Texts -->
          <h3 class="cert-name">{{ c.name }}</h3>
          <div class="cert-code">
            <span class="dot"></span>
            Code: <span class="code">{{ c.code }}</span>
          </div>

          <!-- Verified strip -->
          <div class="verified" *ngIf="c.verifyUrl; else unverified">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 6 9 17l-5-5"/>
            </svg>
            <span class="v-text">Verified</span>
            <span class="v-link">View Credential
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 17 17 7"/><path d="M8 7h9v9"/>
              </svg>
            </span>
          </div>
          <ng-template #unverified>
            <div class="verified">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 6 9 17l-5-5"/>
              </svg>
              Verified Credential
            </div>
          </ng-template>
        </a>

      </ng-container>
    </ng-container>
  </div>
</div>
